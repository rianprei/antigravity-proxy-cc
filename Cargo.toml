[package]
name = "antigravity-proxy-cc"
version = "0.1.0"
edition = "2021"
description = "Anthropic Messages API proxy for Google Antigravity (Gemini) models, for Claude Code"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "io-util", "net", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
http-body = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
